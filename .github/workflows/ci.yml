# CI: confere cada PR e cada push na main antes do merge.
#
# Etapas: instalar (npm ci), gerar o cliente do Prisma, lint, checagem de
# tipos, testes com cobertura e build. O resultado aparece no PR como um
# check verde ou vermelho.
#
# Os testes de RLS ficam de fora por enquanto: eles precisam de um PostgreSQL
# com as migrations aplicadas. Rodam localmente com `npm run test:rls`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execucao anterior, que ja ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conferir:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de mentira: o build e os testes de unidade nao conectam no
      # banco nem enviam nada, mas o Prisma e o NextAuth leem estas variaveis.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-segredo-sem-uso-real
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar o cliente do Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Testes com cobertura
        run: npx vitest run --coverage --exclude tests/rls-isolamento.test.ts

      - name: Guardar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

      - name: Build
        run: npx next build
