# SonarQube Cloud: analise de qualidade e cobertura, enviada pelo CI
# (job "Testes (back e front)" em .github/workflows/ci.yml).
sonar.projectKey=anndrelzz_Astro
sonar.organization=anndrelzz
sonar.projectName=Astro

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Codigo gerado pelo `prisma generate`, nao escrito por nos, e o favicon,
# que e imagem e nao codigo.
sonar.exclusions=src/generated/**,**/*.ico

# Relatorio de cobertura gerado pelo Vitest (npm run test:cobertura).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora da COBERTURA (a analise de bugs e seguranca continua valendo), o mesmo
# recorte do coverage.include do vitest.config.mts: os arquivos de pagina do
# Next (page, layout e o default do slot @modal) e o cliente-shell sao
# componentes de servidor assincronos, que buscam dados no banco antes de
# desenhar, e a Testing Library nao os renderiza. A logica que eles chamam
# fica em src/back e src/compartilhado, que contam. Sem isto, o Sonar media
# outra coisa que o Vitest e todo PR que tocasse uma pagina reprovava.
sonar.coverage.exclusions=src/app/**/page.tsx,src/app/**/layout.tsx,src/app/**/default.tsx,src/front/cliente/cliente-shell.tsx
