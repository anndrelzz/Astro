# SonarQube Cloud: analise de qualidade e cobertura, enviada pelo CI
# (job "Testes do backend" em .github/workflows/ci.yml).
sonar.projectKey=anndrelzz_Astro
sonar.organization=anndrelzz
sonar.projectName=Astro

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Codigo gerado pelo `prisma generate`, nao escrito por nos.
sonar.exclusions=src/generated/**

# Relatorio de cobertura gerado pelo Vitest (npm run test:cobertura).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
